name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Public Repository Leak Check
        if: github.repository == 'Zhgong/codesys-mcp-plugin'
        shell: powershell
        run: |
          Write-Host "Running Public Repository Leak Check for $($env:GITHUB_REPOSITORY)..."
          $forbidden = @("wiki", "roadmap", "docs/internal", ".private")
          $leaked = @()
          foreach ($dir in $forbidden) {
            if (Test-Path $dir) {
              $leaked += $dir
            }
          }
          if ($leaked.Count -gt 0) {
            Write-Error "CRITICAL SECURITY VIOLATION: Internal directories found in public repo: $($leaked -join ', ')"
            exit 1
          }
          Write-Host "Leak check passed: No internal directories found in public repository."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywin32

      - name: Run test suite
        shell: powershell
        run: |
          .\run_tests.ps1
